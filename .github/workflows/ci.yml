name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (Non-blocking)
        # Using || true ensures the CI continues even if high vulns are found
        # Using --audit-level=critical narrows the focus to the most dangerous issues
        run: npm audit --audit-level=critical || true

      - name: Lint & Test
        # Combined into one step to keep the logs cleaner
        run: |
          npm run lint
          npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./dist