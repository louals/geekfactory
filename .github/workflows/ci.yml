name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Check Formatting & Lint
        run: |
          npm run format:check
          npm run lint

      - name: Run Tests
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload Artifact
        if: github.ref == 'refs/heads/main' # Only save build on main branch
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./dist
